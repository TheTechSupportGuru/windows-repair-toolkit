name: Bug report
description: Something in one of the tools doesn't work or gives a wrong result.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Pick the tool (and, if you know it, the tab or part) where the problem happens, so it can be found and fixed quickly.
        
        **Before posting logs or screenshots, remove personal details: PC name, user name, IP addresses, serial numbers and any API key. Never post your Claude or Gemini API key.**
  - type: dropdown
    id: tool
    attributes:
      label: "Tool"
      description: "WinRepairTool, Collect-Logs, Monitor-Logs and ClaudeLogAnalyzer are parts of WinSuperTool, so they share one entry."
      options:
        - "WinSuperTool / individual tools (WinRepairTool, Collect-Logs, Monitor-Logs, ClaudeLogAnalyzer)"
        - "WinSuperTool no-AI edition"
        - "WinFixKit"
        - "Backup Script Builder"
        - "7z-Encryptor"
        - "Test Center"
        - "Run-PS-As-Admin"
        - "Not sure / not about one tool"
    validations:
      required: true
  - type: input
    id: part
    attributes:
      label: "Which tab or part? (optional)"
      placeholder: "for example Automation tab, Collect-Logs, Network fixes"
  - type: dropdown
    id: version
    attributes:
      label: "Tool version"
      description: "The version line is near the top of the script, for example \"# Version 2.0\"."
      options:
        - "2.7 (latest)"
        - "2.6"
        - "2.5"
        - "2.4"
        - "2.3"
        - "2.2"
        - "2.1"
        - "2.0"
        - "1.9.x"
        - "A beta (Test Center)"
        - "1.8.x or older"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: "Windows edition"
      description: "Where did you run the tool?"
      options:
        - "Windows 11"
        - "Windows 10 64-bit"
        - "Windows 10 32-bit"
        - "Hiren's BootCD PE 11"
        - "Hiren's BootCD PE 10"
        - "Other WinPE"
        - "Windows Server"
        - "Other"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: "Windows version and language"
      description: "Optional. Several bugs only show up on some builds or display languages."
      placeholder: "for example 24H2, German"
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: "How bad is it?"
      description: "Pick the closest."
      options:
        - "PC would not boot, or data was lost"
        - "A feature does not work at all"
        - "Wrong or misleading result"
        - "Minor or cosmetic"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened"
      description: "Describe the problem. Include any error message shown in the window."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "What did you click or choose, in order?"
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What you expected"
      description: "What should have happened instead?"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: "Logs or error messages"
      description: "Optional. Paste the relevant lines from the tool's log or output box. Remove personal details first."
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots"
      description: "Optional. Drag images here. Crop out personal details first."
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: "Before you submit"
      options:
        - label: "I searched the existing issues and this is not a duplicate"
          required: false
        - label: "I removed personal details (PC name, user name, IP addresses, keys) from what I posted"
          required: true
