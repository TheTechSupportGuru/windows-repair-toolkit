name: Feature request
description: Suggest a specific change or addition to one of the tools.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a specific change in mind? Describe it here. For open-ended ideas you'd like to talk through first, start a discussion in **Ideas** instead.
  - type: dropdown
    id: tool
    attributes:
      label: "Tool"
      description: "WinRepairTool, Collect-Logs, Monitor-Logs and ClaudeLogAnalyzer are parts of WinSuperTool, so they share one entry."
      options:
        - "WinSuperTool / individual tools (WinRepairTool, Collect-Logs, Monitor-Logs, ClaudeLogAnalyzer)"
        - "WinSuperTool no-AI edition"
        - "WinFixKit"
        - "Backup Script Builder"
        - "7z-Encryptor"
        - "Test Center"
        - "Run-PS-As-Admin"
        - "Not sure / not about one tool"
    validations:
      required: true
  - type: input
    id: part
    attributes:
      label: "Which tab or part? (optional)"
      placeholder: "for example Automation tab, Collect-Logs, Network fixes"
  - type: textarea
    id: idea
    attributes:
      label: "The change you want"
      description: "What should the tool do?"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem it solves"
      description: "What are you trying to do that is hard or impossible today?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Other options you considered"
      description: "Optional."
    validations:
      required: false
