body:
  - type: markdown
    attributes:
      value: |
        General discussion about the toolkit.
  - type: dropdown
    id: tool
    attributes:
      label: "Tool"
      description: "Which tool is this about?"
      options:
        - "WinSuperTool"
        - "WinFixKit"
        - "WinRepairTool"
        - "Collect-Logs"
        - "Monitor-Logs"
        - "ClaudeLogAnalyzer"
        - "Run-PS-As-Admin"
        - "Several tools"
        - "Not about a specific tool"
    validations:
      required: false
  - type: dropdown
    id: part
    attributes:
      label: "Part of the tool"
      description: "Which tab or part of that tool? Options start with the tool name."
