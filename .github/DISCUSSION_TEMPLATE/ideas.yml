title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share an idea for the toolkit. Pick the tool it's about, or **Not sure / not about one tool** for something new.
  - type: dropdown
    id: tool
    attributes:
      label: "Tool"
      description: "WinRepairTool, Collect-Logs, Monitor-Logs and ClaudeLogAnalyzer are parts of WinSuperTool, so they share one entry."
      options:
        - "WinSuperTool / individual tools (WinRepairTool, Collect-Logs, Monitor-Logs, ClaudeLogAnalyzer)"
        - "WinSuperTool no-AI edition"
        - "WinFixKit"
        - "Backup Script Builder"
        - "7z-Encryptor"
        - "Test Center"
        - "Run-PS-As-Admin"
        - "Not sure / not about one tool"
    validations:
      required: true
  - type: input
    id: part
    attributes:
      label: "Which tab or part? (optional)"
      placeholder: "for example Automation tab, Collect-Logs, Network fixes"
  - type: textarea
    id: idea
    attributes:
      label: "Your idea"
      description: "What would you like the tool to do?"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Why it would help"
      description: "What problem does it solve, or what would it make easier?"
    validations:
      required: true
