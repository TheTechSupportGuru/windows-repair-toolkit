title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Ask how to do something with the tools. If something is broken, please open a **Bug report** issue instead.
        
        **Before posting logs or screenshots, remove personal details: PC name, user name, IP addresses, serial numbers and any API key. Never post your Claude or Gemini API key.**
  - type: dropdown
    id: tool
    attributes:
      label: "Tool"
      description: "WinRepairTool, Collect-Logs, Monitor-Logs and ClaudeLogAnalyzer are parts of WinSuperTool, so they share one entry."
      options:
        - "WinSuperTool / individual tools (WinRepairTool, Collect-Logs, Monitor-Logs, ClaudeLogAnalyzer)"
        - "WinSuperTool no-AI edition"
        - "WinFixKit"
        - "Backup Script Builder"
        - "7z-Encryptor"
        - "Test Center"
        - "Run-PS-As-Admin"
        - "Not sure / not about one tool"
    validations:
      required: true
  - type: input
    id: part
    attributes:
      label: "Which tab or part? (optional)"
      placeholder: "for example Automation tab, Collect-Logs, Network fixes"
  - type: textarea
    id: question
    attributes:
      label: "Your question"
      description: "What are you trying to do?"
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: "What you tried"
      description: "Optional. What did you try, and what happened?"
    validations:
      required: false
  - type: dropdown
    id: version
    attributes:
      label: "Tool version"
      description: "The version line is near the top of the script, for example \"# Version 2.0\"."
      options:
        - "2.7 (latest)"
        - "2.6"
        - "2.5"
        - "2.4"
        - "2.3"
        - "2.2"
        - "2.1"
        - "2.0"
        - "1.9.x"
        - "A beta (Test Center)"
        - "1.8.x or older"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: "Windows edition"
      description: "Optional."
      options:
        - "Windows 11"
        - "Windows 10 64-bit"
        - "Windows 10 32-bit"
        - "Hiren's BootCD PE 11"
        - "Hiren's BootCD PE 10"
        - "Other WinPE"
        - "Windows Server"
        - "Other"
    validations:
      required: false
